<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samson's Wordle</title>
<style>
  body { background: #121213; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
  .board { display: grid; grid-template-rows: repeat(6, 60px); grid-gap: 5px; margin-top: 20px; }
  .row { display: grid; grid-template-columns: repeat(5, 60px); grid-gap: 5px; }
  .tile { border: 2px solid #3a3a3c; display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; }
</style>
</head>
<body>
<h1>SAMSON'S WORDLE</h1>
<div class="board" id="board"></div>
<script>
  // פשוט תשנה את המילה שבין הגרשיים בכל יום ותשמור את הקובץ:
  let targetWord = "APPLE"; 
  
  const board = document.getElementById('board');
  for (let r = 0; r < 6; r++) {
    const row = document.createElement('div'); row.className = 'row';
    for (let c = 0; c < 5; c++) {
      const tile = document.createElement('div'); tile.className = 'tile';
      row.appendChild(tile);
    }
    board.appendChild(row);
  }
  alert("המשחק עלה! המילה מוגדרת בקוד.");
</script>
</body>
</html>
