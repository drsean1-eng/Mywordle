<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Samson's Wordle</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#fff;color:#222;text-align:center}
h1{font-size:30px;margin:22px 0 6px}.sub{color:#666;margin-bottom:18px}
#board{width:310px;margin:15px auto 12px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{height:56px;border:2px solid #d3d6da;font-size:30px;font-weight:bold;display:flex;align-items:center;justify-content:center;text-transform:uppercase}
.tile.filled{border-color:#888}.correct{background:#6aaa64!important;color:white;border-color:#6aaa64!important}.present{background:#c9b458!important;color:white;border-color:#c9b458!important}.absent{background:#787c7e!important;color:white;border-color:#787c7e!important}
#keyboard{max-width:500px;margin:10px auto;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:0 8px}.key{height:48px;min-width:28px;padding:0 9px;border:0;border-radius:4px;background:#d3d6da;font-weight:bold;cursor:pointer}.key.wide{min-width:58px;font-size:12px}
#msg{min-height:30px;font-weight:bold;font-size:17px;margin:12px}.info{font-size:13px;color:#777;margin:18px}
#admin{display:none;margin:18px auto;padding:15px;max-width:360px;border:1px solid #ddd;border-radius:8px}.admin input{padding:9px;width:180px;text-transform:uppercase}.admin button{padding:9px}
</style>
</head>
<body>
<h1>Samson's Wordle</h1>
<div class="sub">A private Wordle for friends</div>
<div id="board"></div>
<div id="msg"></div>
<div id="keyboard"></div>
<div class="info">6 guesses • 5 letters • Same puzzle for everyone</div>

<div id="admin">
  <b>Set today's secret word</b><br><br>
  <input id="secretInput" maxlength="5" placeholder="5 letters">
  <button onclick="setSecret()">Set Word</button>
  <p style="font-size:12px;color:#777">This is for the host. Don't share the word.</p>
</div>

<script>
/*
  HOST SETUP:
  Change SECRET below before sending the file to your friends.
  Example: const SECRET = "APPLE";
*/
const SECRET = "APPLE";

const WORDS = [
"APPLE","BEACH","BRAIN","BRAVE","CHAIR","CLOUD","DREAM","EARTH","FLAME","FRUIT",
"GLASS","GRAPE","GREEN","HEART","HOUSE","LIGHT","MAGIC","MONEY","MOUSE","MUSIC",
"NIGHT","OCEAN","PARTY","PEACE","PHONE","PIANO","PLANT","QUEEN","QUIET","RIVER",
"ROBOT","ROUND","SHARE","SHINE","SMILE","SPACE","SPOON","STORM","SWEET","TABLE",
"TIGER","TRAIN","TRUST","WATER","WORLD","WRITE","YOUTH"
];

let answer = SECRET.toUpperCase();
let guesses=[], current="", gameOver=false;
const board=document.getElementById("board"), msg=document.getElementById("msg"), keyboard=document.getElementById("keyboard");

function makeBoard(){
  board.innerHTML="";
  for(let r=0;r<6;r++)for(let c=0;c<5;c++){
    const d=document.createElement("div"); d.className="tile"; d.id=`t-${r}-${c}`; board.appendChild(d);
  }
}
function draw(){
  for(let r=0;r<6;r++)for(let c=0;c<5;c++){
    const d=document.getElementById(`t-${r}-${c}`);
    d.textContent=(guesses[r]?.[c]||"");
  }
  for(let c=0;c<5;c++) document.getElementById(`t-${guesses.length}-${c}`).textContent=current[c]||"";
}
function makeKeyboard(){
  const rows=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];
  keyboard.innerHTML="";
  rows.forEach((row,i)=>{
    if(i===2)addKey("ENTER","wide");
    [...row].forEach(k=>addKey(k));
    if(i===2)addKey("⌫","wide");
  });
}
function addKey(k,cls=""){
  const b=document.createElement("button");b.className="key "+cls;b.textContent=k;
  b.onclick=()=>key(k);keyboard.appendChild(b);
}
function key(k){
  if(gameOver)return;
  if(k==="⌫"){current=current.slice(0,-1);draw();return}
  if(k==="ENTER"){submit();return}
  if(current.length<5){current+=k;draw()}
}
function submit(){
  if(current.length!==5){msg.textContent="Enter a 5-letter word.";return}
  if(!WORDS.includes(current) && current!==answer){msg.textContent="That word isn't in the word list.";return}
  const guess=current; guesses.push(guess); current="";
  for(let i=0;i<5;i++){
    const tile=document.getElementById(`t-${guesses.length-1}-${i}`);
    tile.classList.add(guess[i]===answer[i]?"correct":answer.includes(guess[i])?"present":"absent");
  }
  if(guess===answer){gameOver=true;msg.textContent=`🎉 Brilliant! You solved it in ${guesses.length}/6.`}
  else if(guesses.length===6){gameOver=true;msg.textContent=`The word was ${answer}. Better luck tomorrow!`}
  else msg.textContent="";
}
document.addEventListener("keydown",e=>{
  if(e.key==="Enter")key("ENTER");
  else if(e.key==="Backspace")key("⌫");
  else if(/^[a-zA-Z]$/.test(e.key))key(e.key.toUpperCase());
});
function setSecret(){
  const v=document.getElementById("secretInput").value.toUpperCase();
  if(/^[A-Z]{5}$/.test(v)){localStorage.setItem("samsonWordleSecret",v);location.reload()}
}
const saved=localStorage.getItem("samsonWordleSecret");
if(saved && /^[A-Z]{5}$/.test(saved)) answer=saved;
makeBoard();makeKeyboard();draw();

// Host shortcut: press H five times to show the private host panel.
let hs="";
document.addEventListener("keydown",e=>{
  if(e.key.toLowerCase()==="h"){hs+="h";if(hs.length>=5){document.getElementById("admin").style.display="block";hs=""}}
  else hs="";
});
</script>
</body>
</html>
