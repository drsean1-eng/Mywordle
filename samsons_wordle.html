<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Samson's Wordle</title>
<style>
  body { background: #121213; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 0; padding-bottom: 20px; }
  .board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 5px; margin: 10px 0; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .tile { width: 50px; height: 50px; border: 2px solid #3a3a3c; display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; }
  .c { background: #538d4e; border-color: #538d4e;} 
  .p { background: #b59f3b; border-color: #b59f3b;} 
  .a { background: #3a3a3c; border-color: #3a3a3c;}
  #box { display: none; width: 90%; margin-top: 15px; text-align: center; }
  textarea { width: 100%; height: 90px; background: #222; color: white; border: 1px solid #555; font-size: 1rem; margin-bottom: 10px; display: none; }
  #msg-err { color: white; background: #e74c3c; padding: 8px 15px; border-radius: 4px; font-weight: bold; margin-bottom: 10px; display: none; }
  
  /* עיצוב לכפתור השיתוף החדש */
  #share-btn { background: #538d4e; color: white; border: none; padding: 12px 24px; font-size: 1.2rem; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; max-width: 300px; margin: 0 auto; display: flex; justify-content: center; align-items: center; gap: 8px; }
  #share-btn:active { background: #43703e; }
</style>
</head>
<body>
<h1>SAMSON'S WORDLE</h1>
<div id="msg-err">Not a valid word!</div>
<div class="board" id="b"></div>
<div id="box">
  <textarea id="res" readonly></textarea>
  <button id="share-btn" onclick="shareResult()">שתף תוצאה 📤</button>
</div>
<script>
  const word = "EDIFY"; // <--- המילה היומית
  
  // איפוס חכם
  if (localStorage.getItem('current_word') !== word) {
    localStorage.removeItem('guesses');
    localStorage.removeItem('r');
    localStorage.setItem('current_word', word);
  }

  // טעינת המילון
  let validWords = new Set([word, "SNORE", "NORTH", "APPLE", "STARS", "PARTY", "DANCE", "LIGHT", "BRAIN", "WORLD", "SNARE", "PLANE"]);
  
  fetch('https://cdn.jsdelivr.net/gh/tabatkins/wordle-list@main/words')
    .then(res => res.text())
    .then(text => {
      text.split('\n').forEach(w => {
        if(w.trim()) validWords.add(w.trim().toUpperCase());
      });
    }).catch(e => console.log("Using default dictionary"));

  let r = 0, t = 0, over = false, won = false;
  let guesses = JSON.parse(localStorage.getItem('guesses')) || Array.from({length: 6}, () => Array(5).fill(''));
  let savedR = parseInt(localStorage.getItem('r')) || 0;
  r = savedR;

  const board = document.getElementById('b');
  for (let i = 0; i < 6; i++) {
    let row = document.createElement('div'); row.className = 'row';
    for (let j = 0; j < 5; j++) {
      let tile = document.createElement('div'); tile.className = 'tile'; tile.id = `t-${i}-${j}`;
      if (guesses[i][j]) tile.innerText = guesses[i][j];
      row.appendChild(tile);
    }
    board.appendChild(row);
  }

  for (let i = 0; i < r; i++) {
    let guessStr = guesses[i].join('');
    if (guessStr.length === 5) paintRow(i, guessStr);
  }
  if (savedR >= 6 || (r > 0 && guesses[r-1].join('') === word)) {
    over = true;
    show();
  }

  function press(k) {
    if (over) return;
    document.getElementById('msg-err').style.display = "none";
    
    if (k === 'ENTER') check();
    else if (k === 'DEL') { 
      if (t > 0) { 
        t--; 
        guesses[r][t] = ''; 
        document.getElementById(`t-${r}-${t}`).innerText = ''; 
      } 
    }
    else if (t < 5) { 
      guesses[r][t] = k; 
      document.getElementById(`t-${r}-${t}`).innerText = k; 
      t++; 
    }
  }

  let keysHtml = '<div style="display:grid; grid-template-columns:repeat(10, 1fr); gap:4px; width:98%; max-width:400px; margin-top:10px;">';
  "QWERTYUIOPASDFGHJKLZXCVBNM".split('').forEach(ch => { keysHtml += `<button style="padding:10px 0; font-weight:bold;" onclick="press('${ch}')">${ch}</button>`; });
  keysHtml += `<button style="grid-column: span 3; font-weight:bold;" onclick="press('ENTER')">ENTER</button><button style="grid-column: span 3; font-weight:bold;" onclick="press('DEL')">⌫</button></div>`;
  document.body.innerHTML += keysHtml;

  function check() {
    let guess = guesses[r].join('');
    if (guess.length < 5) return;
    
    if (!validWords.has(guess)) {
      let err = document.getElementById('msg-err');
      err.style.display = 'block';
      setTimeout(() => err.style.display = 'none', 1500);
      return;
    }

    paintRow(r, guess);
    
    localStorage.setItem('guesses', JSON.stringify(guesses));
    localStorage.setItem('r', r + 1);
    
    if (guess === word) { won = true; r++; finish(); } 
    else if (r === 5) { r++; finish(); } 
    else { r++; t = 0; }
  }

  function paintRow(rowIdx, guess) {
    let targetArr = word.split('');
    let guessArr = guess.split('');
    let rowTiles = [];
    
    for (let i = 0; i < 5; i++) {
      rowTiles.push(document.getElementById(`t-${rowIdx}-${i}`));
    }

    for (let i = 0; i < 5; i++) {
      if (guessArr[i] === targetArr[i]) { 
        rowTiles[i].classList.add('c'); 
        targetArr[i] = null; 
        guessArr[i] = null; 
      }
    }
    for (let i = 0; i < 5; i++) {
      if (guessArr[i] !== null) {
        let idx = targetArr.indexOf(guessArr[i]);
        if (idx > -1) { 
          rowTiles[i].classList.add('p'); 
          targetArr[idx] = null; 
        } else { 
          rowTiles[i].classList.add('a'); 
        }
      }
    }
  }

  function finish() {
    over = true;
    show();
  }

  function show() {
    document.getElementById('box').style.display = 'block';
    let text = `Samson's Wordle ${won ? r : 'X'}/6\n\n`;
    for (let i = 0; i < r; i++) {
      for (let j = 0; j < 5; j++) {
        let el = document.getElementById(`t-${i}-${j}`);
        if (el.classList.contains('c')) text += '🟩';
        else if (el.classList.contains('p')) text += '🟨';
        else text += '⬛';
      }
      text += '\n';
    }
    document.getElementById('res').value = text;
  }

  // פונקציית השיתוף החדשה
  function shareResult() {
    const text = document.getElementById('res').value;
    if (navigator.share) {
      navigator.share({
        title: "Samson's Wordle",
        text: text
      }).catch(console.error);
    } else {
      navigator.clipboard.writeText(text).then(() => {
        alert("התוצאה הועתקה ללוח! עכשיו אפשר להדביק אותה איפה שתרצה.");
      });
    }
  }
</script>
</body>
</html>
