<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Samson's Wordle</title>
<style>
  body { font-family: sans-serif; background-color: #121213; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; padding-bottom: 20px; }
  .board { display: grid; grid-template-rows: repeat(6, 1fr); grid-gap: 5px; margin: 10px 0; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); grid-gap: 5px; }
  .tile { width: 50px; height: 50px; border: 2px solid #3a3a3c; display: inline-flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; }
  .correct { background-color: #538d4e; }
  .present { background-color: #b59f3b; }
  .absent { background-color: #3a3a3c; }
  #share-area { display: none; width: 90%; margin-top: 20px; text-align: center; }
  textarea { width: 100%; height: 100px; background: #222; color: white; border: 1px solid #555; padding: 10px; font-size: 1rem; }
</style>
</head>
<body>
<h1>SAMSON'S WORDLE</h1>
<div class="board" id="board"></div>
<div id="share-area">
  <p>Copy your result:</p>
  <textarea id="result-text" readonly></textarea>
</div>
<script>
  const targetWord = "APPLE";
  let currentRow = 0, currentTile = 0, gameOver = false, gameWon = false;
  let guesses = Array.from({length: 6}, () => Array(5).fill(''));

  const board = document.getElementById('board');
  for (let r = 0; r < 6; r++) {
    const row = document.createElement('div'); row.className = 'row';
    for (let c = 0; c < 5; c++) {
      const tile = document.createElement('div'); tile.className = 'tile'; tile.id = `tile-${r}-${c}`;
      row.appendChild(tile);
    }
    board.appendChild(row);
  }

  function press(key) {
    if (gameOver) return;
    if (key === 'Enter') checkGuess();
    else if (key === 'Backspace') { if (currentTile > 0) { currentTile--; document.getElementById(`tile-${currentRow}-${currentTile}`).innerText = ''; } }
    else if (currentTile < 5) { guesses[currentRow][currentTile] = key; document.getElementById(`tile-${currentRow}-${currentTile}`).innerText = key; currentTile++; }
  }
  // הוספת מקלדת פשוטה מאוד
  document.body.innerHTML += '<div style="display:grid; grid-template-columns:repeat(10, 1fr); gap:5px; width:95%; margin-top:10px;">' + "QWERTYUIOPASDFGHJKLZXCVBNM".split('').map(k => `<button style="padding:10px;" onclick="press('${k}')">${k}</button>`).join('') + '<button onclick="press(\'Enter\')">OK</button><button onclick="press(\'Backspace\')">⌫</button></div>';

  function checkGuess() {
    if (currentTile < 5) return;
    let guess = guesses[currentRow].join('');
    for (let i = 0; i < 5; i++) {
      let t = document.getElementById(`tile-${currentRow}-${i}`);
      if (guess[i] === targetWord[i]) t.classList.add('correct');
      else if (targetWord.includes(guess[i])) t.classList.add('present');
      else t.classList.add('absent');
    }
    if (guess === targetWord) { gameOver = true; gameWon = true; showShare(); }
    else if (currentRow === 5) { gameOver = true; showShare(); }
    else { currentRow++; currentTile = 0; }
  }

  function showShare() {
    document.getElementById('share-area').style.display = 'block';
    let text = `Samson's Wordle ${gameWon ? currentRow + 1 : 'X'}/6\n\n`;
    for (let r = 0; r <= currentRow; r++) {
      for (let c = 0; c < 5; c++) {
        let t = document.getElementById(`tile-${r}-${c}`);
        if (t.classList.contains('correct')) text += '🟩';
        else if (t.classList.contains('present')) text += '🟨';
        else text += '⬛';
      }
      text += '\n';
    }
    document.getElementById('result-text').value = text;
  }
</script>
</body>
</html>
