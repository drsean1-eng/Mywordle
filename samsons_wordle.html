<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dr. Sean's Words</title>
    <style>
        :root {
            --green: #6aaa64;
            --yellow: #c9b458;
            --gray: #787c7e;
            --dark-gray: #3a3a3c;
            --background: #121213;
            --text: #ffffff;
        }
        body {
            background-color: var(--background);
            color: var(--text);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            user-select: none;
        }
        header {
            text-align: center;
            padding: 10px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--dark-gray);
            width: 100%;
        }
        #board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 5px;
            padding: 10px;
            box-sizing: border-box;
            aspect-ratio: 5 / 6;
            max-height: 40vh;
            margin: auto;
        }
        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }
        .tile {
            width: 50px;
            height: 50px;
            border: 2px solid var(--dark-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            color: var(--text);
            background-color: transparent;
            box-sizing: border-box;
        }
        .tile.filled {
            border-color: var(--gray);
        }
        .tile.correct { background-color: var(--green); border-color: var(--green); }
        .tile.present { background-color: var(--yellow); border-color: var(--yellow); }
        .tile.absent { background-color: var(--dark-gray); border-color: var(--dark-gray); }

        #keyboard {
            width: 100%;
            max-width: 500px;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
        }
        .key {
            background-color: var(--gray);
            color: var(--text);
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            padding: 14px 0;
            flex: 1;
            cursor: pointer;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .key.large {
            flex: 1.5;
            font-size: 12px;
        }
        #message-container {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            pointer-events: none;
        }
        .message {
            background-color: var(--text);
            color: var(--background);
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            margin-bottom: 10px;
            opacity: 0.9;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <header>DR. SEAN'S WORDS</header>

    <div id="message-container"></div>

    <div id="board"></div>

    <div id="keyboard">
        <div class="keyboard-row">
            <button class="key" data-key="q">q</button>
            <button class="key" data-key="w">w</button>
            <button class="key" data-key="e">e</button>
            <button class="key" data-key="r">r</button>
            <button class="key" data-key="t">t</button>
            <button class="key" data-key="y">y</button>
            <button class="key" data-key="u">u</button>
            <button class="key" data-key="i">i</button>
            <button class="key" data-key="o">o</button>
            <button class="key" data-key="p">p</button>
        </div>
        <div class="keyboard-row">
            <button class="key" data-key="a">a</button>
            <button class="key" data-key="s">s</button>
            <button class="key" data-key="d">d</button>
            <button class="key" data-key="f">f</button>
            <button class="key" data-key="g">g</button>
            <button class="key" data-key="h">h</button>
            <button class="key" data-key="j">j</button>
            <button class="key" data-key="k">k</button>
            <button class="key" data-key="l">l</button>
        </div>
        <div class="keyboard-row">
            <button class="key large" data-key="ENTER">ENTER</button>
            <button class="key" data-key="z">z</button>
            <button class="key" data-key="x">x</button>
            <button class="key" data-key="c">c</button>
            <button class="key" data-key="v">v</button>
            <button class="key" data-key="b">b</button>
            <button class="key" data-key="n">n</button>
            <button class="key" data-key="m">m</button>
            <button class="key large" data-key="BACK">⌫</button>
        </div>
    </div>

    <script>
        const WORD = "SMART";
        const ROWS = 6;
        const COLS = 5;
        let currentRow = 0;
        let currentTile = 0;
        let boardState = Array(ROWS).fill("").map(() => Array(COLS).fill(""));
        let isGameOver = false;

        const boardElement = document.getElementById("board");

        function initBoard() {
            for (let r = 0; r < ROWS; r++) {
                const rowElement = document.createElement("div");
                rowElement.classList.add("row");
                for (let c = 0; c < COLS; c++) {
                    const tileElement = document.createElement("div");
                    tileElement.classList.add("tile");
                    tileElement.id = `tile-${r}-${c}`;
                    rowElement.appendChild(tileElement);
                }
                boardElement.appendChild(rowElement);
            }
        }

        function showMessage(text, duration = 2000) {
            const container = document.getElementById("message-container");
            const msg = document.createElement("div");
            msg.classList.add("message");
            msg.textContent = text;
            container.appendChild(msg);
            setTimeout(() => {
                msg.style.opacity = "0";
                setTimeout(() => msg.remove(), 300);
            }, duration);
        }

        function handleKeyPress(key) {
            if (isGameOver) return;

            if (key === "ENTER") {
                if (currentTile < COLS) {
                    showMessage("Not enough letters");
                    return;
                }
                submitGuess();
            } else if (key === "BACK" || key === "Backspace") {
                if (currentTile > 0) {
                    currentTile--;
                    boardState[currentRow][currentTile] = "";
                    updateBoard();
                }
            } else {
                if (currentTile < COLS) {
                    boardState[currentRow][currentTile] = key.toLowerCase();
                    currentTile++;
                    updateBoard();
                }
            }
        }

        function updateBoard() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const tile = document.getElementById(`tile-${r}-${c}`);
                    tile.textContent = boardState[r][c];
                    if (boardState[r][c]) {
                        tile.classList.add("filled");
                    } else {
                        tile.classList.remove("filled");
                    }
                }
            }
        }

        function submitGuess() {
            const guess = boardState[currentRow].join("").toUpperCase();
            if (guess.length !== COLS) return;

            const solutionChars = WORD.split("");
            const guessChars = guess.split("");
            const rowTiles = [];
            for (let c = 0; c < COLS; c++) {
                rowTiles.push(document.getElementById(`tile-${currentRow}-${c}`));
            }

            for (let c = 0; c < COLS; c++) {
                if (guessChars[c] === solutionChars[c]) {
                    rowTiles[c].classList.add("correct");
                    solutionChars[c] = null;
                    guessChars[c] = null;
                }
            }

            for (let c = 0; c < COLS; c++) {
                if (guessChars[c] !== null) {
                    const index = solutionChars.indexOf(guessChars[c]);
                    if (index > -1) {
                        rowTiles[c].classList.add("present");
                        solutionChars[index] = null;
                    } else {
                        rowTiles[c].classList.add("absent");
                    }
                }
            }

            if (guess === WORD) {
                showMessage("Genius!", 4000);
                isGameOver = true;
                return;
            }

            currentRow++;
            currentTile = 0;

            if (currentRow === ROWS) {
                showMessage(`Game Over! Word was: ${WORD}`, 5000);
                isGameOver = true;
            }
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") handleKeyPress("ENTER");
            else if (e.key === "Backspace") handleKeyPress("BACK");
            else if (/^[a-zA-Z]$/.test(e.key)) handleKeyPress(e.key.toLowerCase());
        });

        document.querySelectorAll(".key").forEach(button => {
            const key = button.getAttribute("data-key");
            
            button.addEventListener("touchend", (e) => {
                e.preventDefault();
                handleKeyPress(key);
            }, { passive: false });

            button.addEventListener("click", () => {
                handleKeyPress(key);
            });
        });

        initBoard();
    </script>
</body>
</html>
